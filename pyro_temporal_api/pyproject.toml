[project]
name = "pyro_temporal_api"
version = "0.1.0"
description = "FastAPI service validating engine alerts with the temporal smoke model (ONNX, no torch)"
authors = [{ name = "Pyronear", email = "contact@pyronear.org" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0,<0.111",
    "uvicorn[standard]>=0.30.0,<0.31",
    "python-multipart>=0.0.9,<0.1",
    "pyyaml>=6.0",
    "temporal-model-core[onnx] @ git+https://github.com/pyronear/temporal-model.git@449e6b049cc988bd7458ba101249680587eb0b33#subdirectory=core",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
