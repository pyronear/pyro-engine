[project]
name = "pyro_temporal_api"
version = "0.1.0"
description = "FastAPI service validating engine alerts with the temporal smoke model (ONNX, no torch)"
authors = [{ name = "Pyronear", email = "contact@pyronear.org" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.133.1,<0.134",
    "uvicorn[standard]>=0.30.0,<0.31",
    "python-multipart>=0.0.9,<0.1",
    "pyyaml>=6.0",
    "temporal-model-core[onnx] @ git+https://github.com/pyronear/temporal-model.git@0c84a4174e558da4cadc60342bc819b69db02988#subdirectory=core",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false
# Security floors for transitive dependencies
constraint-dependencies = [
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "pillow>=13.0.0",
    "starlette>=1.3.1,<1.4",
]

[tool.ty.src]
include = ["pyro_temporal_api"]

[tool.pytest.ini_options]
pythonpath = ["."]
