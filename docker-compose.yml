services:
  pyro-camera-api:
    build:
      context: ./pyro_camera_api
    image: pyronear/pyro-camera-api:${PYRO_ENGINE_VERSION:-latest}
    container_name: pyro-camera-api
    # Load .env so tokens referenced as ${VAR} by "rest" adapter cameras
    # (in credentials.json) are available inside the container.
    env_file:
      - .env
    environment:
      CAM_USER: ${CAM_USER}
      CAM_PWD: ${CAM_PWD}
      MEDIAMTX_SERVER_IP: ${MEDIAMTX_SERVER_IP}
      ENABLE_STUCK_DETECTOR: ${ENABLE_STUCK_DETECTOR:-true}
      # Testing only: never reboot a camera that looks frozen or does not move
      ALLOW_STILL_CAMERA: ${ALLOW_STILL_CAMERA:-false}
    volumes:
      - ./data:/usr/src/app/data
    restart: always
    network_mode: host
    # tini as PID 1, so the healthcheck's kill -9 -1 also reaches uvicorn
    init: true
    healthcheck:
      # Docker never restarts an unhealthy container by itself: on a hung patrol (503) or an API
      # that stopped answering, kill everything but PID 1 so `restart: always` brings it back.
      # curl retries twice so a single slow answer does not restart it. Connection refused (rc 7)
      # only means uvicorn is still starting, as it binds after camera setup: killing on it would
      # loop at startup (the kill runs during start_period too). A hang before the bind is bounded
      # by the 10 s timeout on every camera call, so rc 7 cannot last.
      test: ["CMD-SHELL", "curl -sf --max-time 5 --retry 2 --retry-delay 5 http://localhost:8081/health/patrols; rc=$$?; [ $$rc -eq 0 ] && exit 0; [ $$rc -eq 7 ] && exit 1; kill -9 -1"]
      interval: 30s
      retries: 3
      start_period: 20s
      timeout: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"


  engine:
    build:
      context: ./engine
    image: pyronear/pyro-engine:${PYRO_ENGINE_VERSION:-latest}
    container_name: engine
    environment:
      API_URL: ${API_URL}
      CAM_USER: ${CAM_USER}
      CAM_PWD: ${CAM_PWD}
    volumes:
      - ./data:/usr/src/app/data
    command: >
      sh -c '
        truncate -s 0 engine.log &&
        python run.py 2>&1 | tee -a engine.log
      '
    restart: always
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'confidence\\|Nighttime detected' engine.log || exit 1"]
      interval: 30s
      retries: 3
      start_period: 20s
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
