services:
  pyro-camera-api:
    build:
      context: ./pyro_camera_api
    image: pyronear/pyro-camera-api:${PYRO_ENGINE_VERSION:-latest}
    container_name: pyro-camera-api
    # Load .env so tokens referenced as ${VAR} by "rest" adapter cameras
    # (in credentials.json) are available inside the container.
    env_file:
      - .env
    environment:
      CAM_USER: ${CAM_USER}
      CAM_PWD: ${CAM_PWD}
      MEDIAMTX_SERVER_IP: ${MEDIAMTX_SERVER_IP}
      ENABLE_STUCK_DETECTOR: ${ENABLE_STUCK_DETECTOR:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/usr/src/app/data
    restart: always
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 30s
      retries: 3
      start_period: 20s
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"


  engine:
    build:
      context: ./engine
    image: pyronear/pyro-engine:${PYRO_ENGINE_VERSION:-latest}
    container_name: engine
    environment:
      API_URL: ${API_URL}
      CAM_USER: ${CAM_USER}
      CAM_PWD: ${CAM_PWD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/usr/src/app/data
    # The json-file driver below is the single rotated log sink; nothing reads a log
    # file inside the container anymore.
    command: python run.py
    restart: always
    network_mode: host
    healthcheck:
      # Liveness comes from the heartbeat file, touched only on real progress (a
      # successful capture, night sleep, autofocus on a responsive camera), so a blind
      # engine goes unhealthy while LOG_LEVEL changes cannot affect the verdict.
      # 10 min tolerates the slowest legitimate gaps (hourly autofocus with unreachable
      # cameras at 2 min each, long alert-cache flushes on a slow uplink).
      test: ["CMD-SHELL", "[ -n \"$$(find data/heartbeat -mmin -10 2>/dev/null)\" ] || exit 1"]
      interval: 30s
      retries: 3
      # Covers the first-boot model download plus the camera API and first-frame waits.
      start_period: 300s
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
