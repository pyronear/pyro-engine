services:
  pyro-camera-api:
    build:
      context: ./pyro_camera_api
    image: pyronear/pyro-camera-api:${PYRO_ENGINE_VERSION:-latest}
    container_name: pyro-camera-api
    # Load .env so tokens referenced as ${VAR} by "rest" adapter cameras
    # (in credentials.json) are available inside the container.
    env_file:
      - .env
    environment:
      CAM_USER: ${CAM_USER}
      CAM_PWD: ${CAM_PWD}
      MEDIAMTX_SERVER_IP: ${MEDIAMTX_SERVER_IP}
      ENABLE_STUCK_DETECTOR: ${ENABLE_STUCK_DETECTOR:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/usr/src/app/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
      # Optional autofocus captures are temporary, as they were in the container layer.
      - /usr/src/app/focus_debug:size=128m,mode=0700
    init: true
    restart: always
    network_mode: host
    healthcheck:
      # Docker never restarts an unhealthy container by itself: on a hung patrol (503) or an API
      # that stopped answering, kill everything but PID 1 so `restart: always` brings it back.
      # The kill runs on the first failed check, so `retries` gives no margin: the probe tries
      # 9 times (5 s timeout, 10 s apart), 80 s (fast 503) to 125 s, so a saturated Pi does not
      # restart the API, with every camera and live stream. `timeout` stays above that, or Docker
      # kills the check before the kill runs. Connection refused only means uvicorn is still
      # starting, as it binds after camera setup: killing on it would loop at startup (the kill
      # runs during start_period too). A hang before the bind is bounded by the 10 s timeout on
      # every camera call. The image ships no curl, so the probe uses Python's HTTP client.
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, time
          from http.client import HTTPConnection
          for attempt in range(9):
              if attempt:
                  time.sleep(10)
              try:
                  conn = HTTPConnection("127.0.0.1", 8081, timeout=5)
                  conn.request("GET", "/health/patrols")
                  if conn.getresponse().status == 200:
                      sys.exit(0)
              except ConnectionRefusedError:
                  sys.exit(1)
              except OSError:
                  pass
          os.kill(-1, 9)
      interval: 30s
      retries: 3
      start_period: 20s
      timeout: 140s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"


  # Optional: started only with COMPOSE_PROFILES=temporal (needs data/model_onnx.zip)
  pyro-temporal-api:
    profiles: ["temporal"]
    build:
      context: ./pyro_temporal_api
    image: pyronear/pyro-temporal-api:${PYRO_ENGINE_VERSION:-latest}
    container_name: pyro-temporal-api
    environment:
      TEMPORAL_MODEL_PATH: ${TEMPORAL_MODEL_PATH:-data/model_onnx.zip}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/usr/src/app/data
    restart: always
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  engine:
    build:
      context: .
    image: pyronear/pyro-engine:${PYRO_ENGINE_VERSION:-latest}
    container_name: engine
    environment:
      API_URL: ${API_URL}
      CAM_USER: ${CAM_USER}
      CAM_PWD: ${CAM_PWD}
      TEMPORAL_API_URL: ${TEMPORAL_API_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/usr/src/app/data
    # The json-file driver below is the single rotated log sink; nothing reads a log
    # file inside the container anymore.
    command: python run.py
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: always
    network_mode: host
    # tini as PID 1, so the healthcheck's kill -9 -1 also reaches python
    init: true
    healthcheck:
      # Liveness comes from the heartbeat file, touched on every loop pass, through the
      # night sleep and during autofocus, so LOG_LEVEL changes cannot affect the verdict.
      # 10 min tolerates the slowest legitimate gaps (hourly autofocus with unreachable
      # cameras at 2 min each, long alert-cache flushes on a slow uplink).
      # Docker never restarts an unhealthy container by itself: a stale file kills every
      # process but PID 1 so `restart: always` brings the engine back. No file yet means
      # the engine is still starting (model download) and must not be killed.
      test: ["CMD-SHELL", "[ -n \"$$(find data/heartbeat -mmin +10 2>/dev/null)\" ] && kill -9 -1; [ -n \"$$(find data/heartbeat -mmin -10 2>/dev/null)\" ]"]
      interval: 30s
      retries: 3
      # Covers the first-boot model download plus the camera API and first-frame waits.
      start_period: 300s
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
