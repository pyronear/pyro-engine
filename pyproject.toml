[build-system]
requires = ["setuptools>=67.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyroengine"
dynamic = ["version"]
description = "Wildfire detection on edge devices"
authors = [{ name = "Pyronear", email = "contact@pyronear.org" }]
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = ["pytorch", "deep learning", "vision", "cnn", "wildfire"]
requires-python = ">=3.11,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.33.0,<3",
    "python-dotenv==1.1.0",
    "pyroclient @ git+https://github.com/pyronear/pyro-api.git@main#subdirectory=client",
    "pyro_camera_api_client",
    "pyro_predictor",
    "onvif-zeep>=0.2.12",
]

[project.urls]
documentation = "https://pyronear.org/pyro-engine"
repository = "https://github.com/pyronear/pyro-engine"
tracker = "https://github.com/pyronear/pyro-engine/issues"

[tool.setuptools.packages.find]
include = ["pyroengine*"]

[tool.uv]
required-version = ">=0.13.4,<1.0.0"

[tool.uv.sources]
pyro_camera_api_client = { path = "pyro_camera_api/client", editable = true }
pyro_predictor = { path = "pyro-predictor", editable = true }

[dependency-groups]
quality = [
    "ruff>=0.17.3,<0.18",
    "ty>=0.0.97,<0.1",
]
test = [
    "pytest>=7.0,<8",
    "pytest-asyncio>=0.23.0,<0.24",
    "coverage>=7.4.0,<8",
    "onnx>=1.15.0,<2",
]
dev = [
    { include-group = "quality" },
    { include-group = "test" },
]
docs = [
    "sphinx>=7.2.6,<8",
    "furo>=2024.1.29",
    "sphinxemoji>=0.2.0,<0.3",
    "sphinx-copybutton>=0.5.2,<0.6",
    "Jinja2>=3.1.3,<4",
]

[tool.coverage.run]
source = ["pyroengine"]

[tool.ty.environment]
python-version = "3.11"
root = [".", "pyro-predictor", "pyro_camera_api/client", "pyro_camera_api"]

[tool.ty.analysis]
# NCNN exposes its API through an untyped native extension.
replace-imports-with-any = ["ncnn.**"]

[tool.ty.src]
include = [
    "pyroengine",
    "pyro-predictor/pyro_predictor",
    "pyro_camera_api/client/pyro_camera_api_client",
]

[tool.ruff]
line-length = 120
target-version = "py311"
preview = true

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N",
    "blank-line-before-function", "blank-line-after-function", "under-indentation", "over-indentation", "overindented-section", "overindented-section-underline", "triple-single-quotes", "escape-sequence-in-docstring", "undocumented-param", "empty-docstring",
    "YTT", "ANN", "ASYNC", "S", "BLE", "B", "A", "COM", "CPY", "C4", "T10", "ISC", "ICN", "LOG",
    "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SIM", "ARG", "PTH", "PERF", "NPY", "FURB", "RUF"
]
ignore = [
    "line-too-long", "function-call-in-default-argument", "raise-without-from-inside-except", "complex-structure", "undefined-local-with-import-star", "lambda-assignment", "unnecessary-comprehension",
    "missing-type-args", "missing-type-kwargs", "missing-trailing-comma", "single-line-implicit-string-concatenation",
    # Exact comparisons are intentional for discrete camera values and zero-duration commands.
    "float-equality-comparison"
]
exclude = [".git", "pyro-predictor/**", "docs/**"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
known-first-party = ["pyroengine", "pyro_camera_api"]
known-third-party = ["pillow", "tqdm", "onnxruntime", "huggingface_hub"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["unsorted-imports", "unused-import", "missing-copyright-notice"]
"src/**.py" = ["D", "print", "assert", "ANN", "blind-except", "hardcoded-password-func-arg", "request-without-timeout", "request-with-no-cert-validation"]
"setup_presets/**.py" = ["D", "print", "assert", "ANN", "blind-except", "hardcoded-password-func-arg", "request-without-timeout", "request-with-no-cert-validation"]
"tools/**.py" = ["D", "print", "ANN", "blind-except", "hardcoded-temp-file", "try-except-pass", "request-with-no-cert-validation", "hardcoded-sql-expression", "mixed-case-variable-in-global-scope", "function-uses-loop-variable", "unused-method-argument", "ambiguous-unicode-character-string", "ambiguous-unicode-character-comment"]
".github/**.py" = ["D", "print", "ANN", "S", "collections-named-tuple"]
"tests/**.py" = ["undocumented-public-function", "missing-copyright-notice", "assert", "print", "missing-type-function-argument", "missing-return-type-undocumented-public-function", "missing-return-type-private-function", "unused-function-argument", "request-without-timeout"]
"pyro_camera_api/**.py" = ["D", "print", "assert", "ANN", "blind-except", "request-without-timeout", "request-with-no-cert-validation", "suspicious-subprocess-import", "subprocess-without-shell-equals-true", "suspicious-xml-etree-import", "suspicious-xml-element-tree-usage", "module-import-not-at-top-of-file", "unused-async"]
"pyro_camera_api/tests/**.py" = ["invalid-function-name", "hardcoded-password-string", "hardcoded-password-func-arg", "hardcoded-temp-file"]
"pyroengine/core.py" = ["blind-except"]
"pyroengine/sensors.py" = ["request-without-timeout", "request-with-no-cert-validation", "ANN"]
"watchdog/**.py" = ["missing-copyright-notice", "hardcoded-temp-file", "suspicious-url-open-usage", "suspicious-subprocess-import", "subprocess-without-shell-equals-true", "start-process-with-partial-path", "blind-except", "root-logger-call"]
"watchdog/shelly/check_station.py" = ["missing-copyright-notice", "suspicious-url-open-usage", "subprocess-without-shell-equals-true", "start-process-with-partial-path", "blind-except", "print"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
