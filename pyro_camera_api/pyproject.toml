[project]
name = "pyro_camera_api"
version = "0.1.0"
description = "FastAPI service to control cameras"
authors = [{ name = "Pyronear", email = "contact@pyronear.org" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.133.1,<0.134",
    "uvicorn[standard]>=0.30.0,<0.31",
    "python-dotenv>=1.0.1,<2",
    "opencv-python-headless>=4.9.0,<5",
    "pillow>=13.0.0,<14",
    "requests>=2.31.0,<3",
    "onvif-zeep>=0.2.12,<1",
    "numpy>=1.26.4,<2",
    "urllib3>=2.8.0,<3",
    "ncnn==1.0.20240410",
    "onnxruntime==1.19.2",
]

[dependency-groups]
test = [
    "pytest>=9.0.3,<10",
    "httpx>=0.28.1,<0.29",
]
[tool.uv]
package = false
required-version = ">=0.13.4,<1.0.0"
constraint-dependencies = [
    "anyio>=4.14.2",
    "idna>=3.15",
    "starlette>=1.3.1,<1.4",
]

[tool.ty.analysis]
# NCNN exposes its API through an untyped native extension.
replace-imports-with-any = ["ncnn.**"]

[tool.ty.src]
include = ["pyro_camera_api"]
