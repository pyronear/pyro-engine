name: style

on:
  push:
    branches: main
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: ./.github/actions/setup-uv
      - name: Install quality dependencies
        run: uv sync --locked --only-group quality
      - name: Run ruff
        run: |
          uv run --no-sync ruff --version
          uv run --no-sync ruff format --check --diff .
          uv run --no-sync ruff check --output-format github .

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: ./.github/actions/setup-uv
      - name: Type check engine, camera API and temporal API in their own environments
        run: make typecheck
